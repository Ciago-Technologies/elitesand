name: Rust

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "dev", "staging", "prod" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust checks
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup override set stable
    - name: Install pinned TLS provider
      run: |
        curl --fail --location --retry 3 -o "$RUNNER_TEMP/openssl.tar.gz" https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
        printf '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  %s\n' "$RUNNER_TEMP/openssl.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/openssl.tar.gz" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/openssl-3.5.9"
        ./Configure --prefix="$RUNNER_TEMP/ciagomem-tls" --libdir=lib shared no-tests
        make -j2
        make install_sw install_ssldirs
        test -s "$RUNNER_TEMP/ciagomem-tls/ssl/openssl.cnf"
        (umask 077; LD_LIBRARY_PATH="$RUNNER_TEMP/ciagomem-tls/lib" "$RUNNER_TEMP/ciagomem-tls/bin/openssl" req -x509 -newkey ed25519 -nodes -subj /CN=ciagomem-ci-smoke -days 1 -keyout "$RUNNER_TEMP/tls-smoke.key" -out "$RUNNER_TEMP/tls-smoke.pem")
        printf 'LIBRARY_PATH=%s/lib\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/ciagomem-tls" "$RUNNER_TEMP/ciagomem-tls" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$RUNNER_TEMP/ciagomem-tls" >> "$GITHUB_PATH"
    - name: Formatting
      run: cargo fmt --all -- --check
    - name: Workspace and specification contracts
      run: python3 scripts/validate_workspace.py
    - name: Documentation contracts
      run: python3 scripts/validate_documentation.py
    - name: Default release tests
      run: cargo test --release --offline --workspace -- --nocapture
    - name: All-feature release tests
      run: cargo test --release --offline --workspace --all-features -- --nocapture
    # Existing warnings remain visible; a warning-free baseline is not established.
    - name: Clippy
      run: cargo clippy --offline --workspace --all-targets --all-features
    - name: Bounded mesh progress
      run: python3 scripts/check_mesh_progress.py
