[workspace]
members = [
    "coagomem-core",
    "coagomem-wal",
    "coagomem-ql",
    "ciagomem-crypto",
    "ciagomem-engine",
]
resolver = "2"

[profile.release]
panic = "abort"
opt-level = 3

# Unmodified RustCrypto sources retained for offline builds; see vendor/archive-sha256.json.
[patch.crates-io]
hmac = { path = "vendor/hmac-0.12.1" }
sha2 = { path = "vendor/sha2-0.10.9" }
digest = { path = "vendor/digest-0.10.7" }
crypto-common = { path = "vendor/crypto-common-0.1.6" }
block-buffer = { path = "vendor/block-buffer-0.10.4" }
generic-array = { path = "vendor/generic-array-0.14.7" }
typenum = { path = "vendor/typenum-1.17.0" }
version_check = { path = "vendor/version_check-0.9.5" }
cpufeatures = { path = "vendor/cpufeatures-0.2.17" }
subtle = { path = "vendor/subtle-2.6.1" }
roaring = { path = "vendor/roaring-0.10.12" }
wide = { path = "vendor/wide-0.7.33" }
flatbuffers = { path = "vendor/flatbuffers-25.2.10" }
bytemuck = { path = "vendor/bytemuck-1.21.0" }
byteorder = { path = "vendor/byteorder-1.5.0" }
safe_arch = { path = "vendor/safe_arch-0.7.4" }
rustc_version = { path = "vendor/rustc_version-0.4.1" }
semver = { path = "vendor/semver-1.0.25" }
ed25519-dalek = { path = "vendor/ed25519-dalek-2.1.1" }
curve25519-dalek = { path = "vendor/curve25519-dalek-4.1.3" }
ed25519 = { path = "vendor/ed25519-2.2.3" }
signature = { path = "vendor/signature-2.2.0" }
